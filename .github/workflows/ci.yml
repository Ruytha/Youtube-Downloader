name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pywebview is only needed for the app window, not for the tests.
      - name: Install dependencies
        run: python -m pip install yt-dlp mutagen pytest ruff

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
